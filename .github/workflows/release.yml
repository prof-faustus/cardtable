name: Release

# Triggered when a `v*` tag is pushed (e.g. v0.1.0). Builds the Go
# binaries for every supported OS, publishes a multi-arch Docker
# image tagged with the version, and creates a GitHub Release with
# the artifacts attached.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # to create the GitHub Release
  packages: write   # to push to GHCR

jobs:
  binaries:
    name: build binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ''
            arch: amd64
          - os: macos-latest
            goos: darwin
            ext: ''
            arch: amd64
          - os: windows-latest
            goos: windows
            ext: '.exe'
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: populate go.sum
        working-directory: apps/relay-go
        run: go mod tidy

      - name: build relay
        working-directory: apps/relay-go
        run: go build -trimpath -ldflags="-s -w" -o ../../bin/relay-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/relay

      - name: build indexer
        working-directory: apps/relay-go
        run: go build -trimpath -ldflags="-s -w" -o ../../bin/indexer-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/indexer

      - name: build spv
        working-directory: apps/relay-go
        run: go build -trimpath -ldflags="-s -w" -o ../../bin/spv-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/spv

      - name: upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: bin/*

  docker:
    name: publish versioned docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive image tags
        id: tags
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: docker buildx push (multi-arch, versioned)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ github.repository_owner }}/cardtable-relay:${{ steps.tags.outputs.ref }} \
            --tag ghcr.io/${{ github.repository_owner }}/cardtable-relay:latest \
            --file apps/relay-go/Dockerfile \
            --push \
            .

  github-release:
    name: create github release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: list artifacts
        run: ls -R ./release-artifacts

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./release-artifacts/*
