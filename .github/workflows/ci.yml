name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build-test:
    name: typecheck + build + test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile=false

      # build also type-checks via composite project references;
      # running typecheck separately would just be a duplicate pass.
      - run: pnpm build

      - run: pnpm test

  go-relay:
    name: go vet + test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    defaults:
      run:
        working-directory: apps/relay-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go build ./...
      - run: go test -v ./...

  live-relay-integration:
    name: live relay (${{ matrix.os }}, native binary)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install workspace deps
        run: pnpm install --frozen-lockfile=false

      - name: build the relay binary (linux/macos)
        if: runner.os != 'Windows'
        working-directory: apps/relay-go
        run: go build -o ../../bin/relay ./cmd/relay

      - name: build the relay binary (windows)
        if: runner.os == 'Windows'
        working-directory: apps/relay-go
        run: go build -o ../../bin/relay.exe ./cmd/relay

      - name: build TS workspace (codecs needed by the integration package)
        run: pnpm build

      # Git Bash is available on every GH runner; using a single shell
      # across the matrix avoids PowerShell's Start-Process quirks (which
      # bind a process that doesn't actually listen on the requested
      # ports on Windows).
      - name: start relay (all OSes)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=./bin/relay.exe
          else
            BIN=./bin/relay
          fi
          if [ ! -x "$BIN" ] && [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$BIN"
          fi
          ls -la ./bin
          # Launch in background. Git Bash on Windows treats this the
          # same way POSIX shells do — the child inherits a detached
          # session and the parent shell can exit cleanly.
          "$BIN" --addr :8080 --ws-addr :8081 --game demo-game --start-height 100 > relay.log 2>&1 &
          echo $! > relay.pid
          echo "started relay pid=$(cat relay.pid)"
          sleep 2
          if ! kill -0 "$(cat relay.pid)" 2>/dev/null; then
            echo "relay exited within 2s; relay.log:"
            cat relay.log || true
            exit 1
          fi
          echo "relay still running after 2s"

      - name: wait for /healthz (all OSes)
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1; then
              echo "relay is up"; exit 0
            fi
            sleep 1
          done
          echo "relay did not come up after 30s"
          echo "--- relay.log ---"
          cat relay.log || true
          echo "--- listening ports (best-effort) ---"
          if command -v netstat >/dev/null 2>&1; then
            netstat -an 2>/dev/null | grep -E '8080|8081' || true
          fi
          if command -v ss >/dev/null 2>&1; then
            ss -lntp 2>/dev/null | grep -E '8080|8081' || true
          fi
          exit 1

      - name: run live-relay integration tests
        env:
          CARDTABLE_RUN_LIVE: '1'
          CARDTABLE_WS_URL: ws://127.0.0.1:8081/ws
        run: pnpm --filter @cardtable/integration-tests test

      - name: print relay log on failure
        if: failure()
        shell: bash
        run: cat relay.log || true

      - name: stop relay
        if: always()
        shell: bash
        run: |
          if [ -f relay.pid ]; then
            kill "$(cat relay.pid)" 2>/dev/null || true
          fi

  docker-relay:
    name: docker image build + container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: docker buildx build
        run: |
          docker buildx build \
            --tag cardtable-relay:ci \
            --file apps/relay-go/Dockerfile \
            --load \
            .

      - name: install workspace deps
        run: pnpm install --frozen-lockfile=false

      - name: build TS workspace
        run: pnpm build

      - name: docker run relay
        run: |
          docker run --rm -d \
            --name cardtable-relay \
            -p 8080:8080 -p 8081:8081 \
            cardtable-relay:ci \
            --addr :8080 --ws-addr :8081 --game demo-game --start-height 100

      - name: wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/healthz; then
              echo "container is up"; exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs cardtable-relay || true
          exit 1

      - name: run live-relay integration tests against the container
        env:
          CARDTABLE_RUN_LIVE: '1'
          CARDTABLE_WS_URL: ws://localhost:8081/ws
        run: pnpm --filter @cardtable/integration-tests test

      - name: print container logs on failure
        if: failure()
        run: docker logs cardtable-relay || true

      - name: tear down container
        if: always()
        run: docker stop cardtable-relay || true

  spec-validation:
    name: spec docs + test vectors are valid JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: jq-validate every JSON test vector
        run: |
          for f in spec/test-vectors/*.json; do
            echo ">>> $f"
            jq -e . "$f" >/dev/null
          done
      - name: confirm every required spec doc is present
        run: |
          for f in state-machine tx-types script-templates timeout-rules \
                   recovery-rules serialisation ordering-rules \
                   card-protocol wire-protocol peer-discovery; do
            if [ ! -f "spec/$f.md" ]; then
              echo "MISSING: spec/$f.md"; exit 1
            fi
          done
          echo "all spec docs present"
