name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build-test:
    name: typecheck + build + test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: pnpm install --frozen-lockfile=false

      # build also type-checks via composite project references;
      # running typecheck separately would just be a duplicate pass.
      - run: pnpm build

      - run: pnpm test

  go-relay:
    name: go vet + test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    defaults:
      run:
        working-directory: apps/relay-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test ./...

  spec-validation:
    name: spec docs + test vectors are valid JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: jq-validate every JSON test vector
        run: |
          for f in spec/test-vectors/*.json; do
            echo ">>> $f"
            jq -e . "$f" >/dev/null
          done
      - name: confirm every required spec doc is present
        run: |
          for f in state-machine tx-types script-templates timeout-rules \
                   recovery-rules serialisation ordering-rules \
                   card-protocol wire-protocol peer-discovery; do
            if [ ! -f "spec/$f.md" ]; then
              echo "MISSING: spec/$f.md"; exit 1
            fi
          done
          echo "all spec docs present"
